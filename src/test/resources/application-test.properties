# Test Database configuration - Using H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# Disable OpenAI for tests (since it's external)
spring.ai.openai.enabled=false

# Disable web resources for tests
spring.web.resources.add-mappings=false

# Test logging
logging.level.com.gergov.trainingPlan_svc=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR